name: Pylint

on: 
  workflow_dispatch:
  push:
  pull_request:

env:
  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  DNS_RECORD_COMMENT_KEY: ${{ secrets.DNS_RECORD_COMMENT_KEY }}
  DOMAINS_FILE_PATH: ${{ secrets.DOMAINS_FILE_PATH }}
  DOMAINS: ${{ secrets.DOMAINS }}
  SCHEDULE_MINUTES: "5"
  TTL: "1"
  PROXIED: "True"
  TYPE: "A"
  UPDATE_TYPE: "False"
  UPDATE_PROXY: "False"
  UPDATE_TTL: "False"
  
jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest pytest-md pytest-emoji
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
    - name: Run pytest
      run: |
        pytest -v --maxfail=1 --disable-warnings --tb=short --junitxml=pytest-report.xml
    - name: Pytest Summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Pytest Report
        path: pytest-report.xml
    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: pytest-report.xml
